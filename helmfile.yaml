---
helmDefaults:
  kubeContext: kind-kind

repositories:
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server
  - name: jetstack
    url: https://charts.jetstack.io
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: minio
    url: https://charts.min.io
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: chaos-mesh
    url: https://charts.chaos-mesh.org
  - name: argo
    url: https://argoproj.github.io/argo-helm

templates:
  default: &default
    missingFileHandler: Error
    disableValidationOnInstall: true
    cleanupOnFail: false
    wait: true
    waitForJobs: true
    timeout: 900
    values:
      - ./{{`{{ .Release.Name }}`}}/values-{{`{{ .Release.Name }}`}}.yaml

releases:
  # metrics-server
  - name: metrics-server
    namespace: kube-system
    chart: metrics-server/metrics-server
    version: 3.10.0
    <<: *default
  # cert-manager
  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.12.0
    <<: *default
  # ingress-nginx
  - name: ingress-nginx
    namespace: ingress-nginx
    chart: ingress-nginx/ingress-nginx
    version: 4.6.1
    hooks:
      - events: [postsync]
        showlogs: true
        command: /bin/sh
        args:
          - -ec
          - "kubectl wait --namespace {{`{{ .Release.Namespace }}`}} --for=condition=Ready pod --selector=app.kubernetes.io/component=controller --timeout=300s"
    needs:
      - kube-system/metrics-server
      - cert-manager/cert-manager
    <<: *default
  # ArgoCD
  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 5.34.1
    needs:
      - kube-system/metrics-server
      - cert-manager/cert-manager
      - ingress-nginx/ingress-nginx
    <<: *default
  # ArgoCD Apps
  - name: argocd-apps
    namespace: argocd
    chart: argo/argocd-apps
    version: 1.2.0
    needs:
      - kube-system/metrics-server
      - cert-manager/cert-manager
      - ingress-nginx/ingress-nginx
      - argocd/argocd
    <<: *default
